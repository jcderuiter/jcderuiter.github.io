<style>

}

:root
{

}

}

}

}

}

   border-width:  1px;                           /* */
   border-color:  hsl(0, 0%, 0%);                /* */

   font-variant: small-caps;                     /* */
   text-align: center;                           /* */
}

#oplossing > .letter:not(:nth-child(50n+1))
{
   border-left:   none;                          /* */
}

#keuzes
{
   display:          inline-grid;                /* */
/* display:                 grid;                /* */
   grid-template-columns: repeat(4, minmax(1rem, auto));       /* */

/* max-height: 70vh; /* */
       height: 70vh; /* */
   overflow: auto;                               /* */

   gap:                   .5rem;                 /* */
   padding:               1.0rem;                /* */
   background: hsl(345, 50%, 90%);               /* */
}

#keuzes > div:nth-child(4n+3)
{
   text-align: right;                            /* */
}


/* begin copyright style */
.jcr-copy
{
   border-top:  hsl(000, 000%, 020%) thin solid; /* */
   color:       hsl(000, 000%, 020%);            /* */
   font-size:   0.9rem;                          /* */
   text-align:  right;                           /* */
   margin:      1rem 0.5rem;                     /* */
   padding:     0.5rem;                          /* */
   user-select: none;                            /* */
}
.jcr-copy::before { content: '\00a9 '; }          /* */
.jcr-copy::after  { content: ' jcr'; }            /* */
/* end copyright style */
</style>
<script>
'use strict';
document.addEventListener('DOMContentLoaded', e => js_object_citatenTrouw.onload(e), false);

const js_object_citatenTrouw = (() =>
{
   const onload = e =>
   {
      try
      {
         let year = new Date(document.lastModified).getFullYear();
         document.querySelectorAll('.jcr-copy').forEach(y => y.innerHTML = year);
         init();
      }  catch(err) { console.error('oops', err) }
   }

   const person = Array.from(namen.keys());
   const fixed  = new Array(person.length).fill(false);
   const quote  = Array.from(citaten.keys());

   const boxOf  = quote;
   const rowOf  = Array.from(person.keys());


   const init = () =>
   {
      setupSolutionDisplay();

      sortNameList();

      readCookie();

      person.forEach((v, i) =>
      {
         let letter = document.createElement('div');
         letter.id = `L${i}`;
         letter.innerHTML = (fixed[i]) ? namen[v][0].toUpperCase() : namen[v][0].toLowerCase();
         keuzes.appendChild(letter);

         let name = document.createElement('div');
         name.id = `N${i}`;
         name.innerHTML = namen[v][1];
         keuzes.appendChild(name);

         let qnr = document.createElement('div');
         qnr.id = `Q${quote[i]}`;
         qnr.innerHTML = citaten[quote[i]][0]
         keuzes.appendChild(qnr);

         let text = document.createElement('div');
         text.id = `T${quote[i]}`;
         text.innerHTML = citaten[quote[i]][1]
         keuzes.appendChild(text);

         let box = document.getElementById(`B${quote[i]}`);
         box.innerHTML = letter.innerHTML;

         name.classList.add('clickable');
         name.onclick = toggleFixed;

         text.ondragstart = dragStart;
         box.ondragstart  = dragStart;

         if (!fixed[i])
         {
            setDragDrop(text);
            setDragDrop(box);
            setDrop(name);
         }
      });
   }

   const toggleFixed = e =>
   {
      let index = parseInt(e.target.id.substr(1));

      let name   = e.target;
      let letter = document.getElementById(`L${index}`);
      let text   = document.getElementById(`T${index}`);
      let box    = document.getElementById(`B${boxOf[index]}`);

      fixed[index] = !fixed[index];

      let value = letter.innerHTML;

      if (fixed[index])
      {
         value = value.toUpperCase();

         unsetDragDrop(text);
         unsetDragDrop(box);
         unsetDrop(name);
      }
      else
      {
         value = value.toLowerCase();

         setDragDrop(text);
         setDragDrop(box);
         setDrop(name);
      }

      letter.innerHTML = value;
      box.innerHTML    = value;

      writeCookie();
   }

   const drop = e =>
   {
      let isBox = e.dataTransfer.getData(e.dataTransfer.types[0]).charAt(0) == 'B';


      let from = parseInt(e.dataTransfer.getData(e.dataTransfer.types[0]).substr(1));
      let to   = e.target.id.substr(1);

      if (isBox)
      {
         from = rowOf[from];
         to   = rowOf[to];
      }

      let fromQ = document.getElementById(`Q${from}`);
      let fromT = document.getElementById(`T${from}`);
      let fromB = document.getElementById(`B${boxOf[from]}`);

      let toQ = document.getElementById(`Q${to}`);
      let toT = document.getElementById(`T${to}`);
      let toB = document.getElementById(`B${boxOf[to]}`);

      [fromQ.innerHTML,    toQ.innerHTML]    = [toQ.innerHTML,    fromQ.innerHTML];
      [fromT.innerHTML,    toT.innerHTML]    = [toT.innerHTML,    fromT.innerHTML];
      [fromB.innerHTML,    toB.innerHTML]    = [toB.innerHTML,    fromB.innerHTML];
      [quote[from],        quote[to]]        = [quote[to],        quote[from]];
      [rowOf[boxOf[from]], rowOf[boxOf[to]]] = [rowOf[boxOf[to]], rowOf[boxOf[from]]];

      writeCookie();
   }

   const sortNameList = () =>
   {
      // convert html entities (for sorting)
      let convertEntities = document.createElement('div');
      namen.forEach(v =>
      {
         convertEntities.innerHTML = v[0];
         v[0] = convertEntities.innerHTML;
//         convertEntities.innerHTML = v[1]; v[1] = convertEntities.innerHTML;
      });

      person.sort((a, b) => namen[a][0].localeCompare(namen[b][0]) || a - b);
   }


   const setupSolutionDisplay = () =>
   {
      let cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--solutionColumns'));
      let rows = parseInt((citaten.length+cols-1)/cols);

      for (let r = 0; r < rows; r++)
      {
         for (let c = 0 ; c < cols; c++)
         {
            let box = document.createElement('div');
            box.id        = `B${r*cols+c}`;
            box.className = 'letter';

            oplossing.appendChild(box);
         }

         for (let c = 0 ; c < cols; c++)
         {
            let div = document.createElement('div');
            div.className = 'cijfer';

            if (c%5 == 4) { div.innerHTML = r*cols+c+1 }

            oplossing.appendChild(div);
         }
      }
   }

   const readCookie = () =>
   {
      let result = [...document.cookie.split(';').reduce((a,c) =>
                       (c.match(/\s*citaten=/))
                     ? c.split('=')[1]
                     : a, '').matchAll(/([UL])(\d+)/g)];

      if (result.length == citaten.length)
      {
         result.forEach((v, i) =>
         {
            fixed[i] = v[1] == 'U';
            quote[i] = parseInt(v[2]);
            rowOf[parseInt(v[2])] = i;
         });

      }
//      console.log(result);
   }

   const writeCookie = () =>
   {
      let s = '';

      for (let i = 0; i < quote.length; i++)
      {
         s += (fixed[i]) ? 'U' : 'L';
         s += quote[i];
      }

      document.cookie = `citaten=${s};expires=${new Date(Date.now()+1000*60*60*24*7*4).toUTCString()}`;
//      console.log(s);
   }

   const setDragDrop = element =>
   {
      element.draggable  = 'yep';
      element.classList.add('draggable');
      setDrop(element);
//    element.ondragover = dragover;
//    element.ondrop     = drop;
   }

   const setDrop = element =>
   {
      element.ondragover = dragover;
      element.ondrop     = drop;
   }

   const unsetDragDrop = element =>
   {
      element.draggable  = '';
      element.classList.remove('draggable');
      unsetDrop(element);
//    element.ondragover = null;
//    element.ondrop     = null;
   }

   const unsetDrop = element =>
   {
      element.ondragover = null;
      element.ondrop     = null;
   }

   const dragStart = e =>
   {
      e.dataTransfer.setData(e.target.id, e.target.id);
   }


   const dragover = e =>
   {
      let src = e.dataTransfer.types[0].charAt(0).toUpperCase();  // types[0] is het element id, maar in lowercase !?
      let tgt = e.target.id.charAt(0).toUpperCase();

      if (src != tgt && !(src == 'T' && tgt == 'N')) { return }      // todo:  T op N

      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
   }

   return { onload: onload };
})();
</script>
